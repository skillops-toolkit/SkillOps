name: "SkillOps Multi-Runtime Catalog Verification Gate"
description: "Verifies that all catalog Skills (SKILL.md) and Subagents (SUBAGENT.md) pass strict security and layout auditing and transpile cleanly across all 28 supported AI coding IDEs and CLIs."
author: "OdevMatheus"
branding:
  icon: "shield"
  color: "purple"

inputs:
  catalog-path:
    description: "Path to the Skill & Subagent catalog directory."
    required: false
    default: "catalog"
  targets:
    description: "Target AI harnesses to verify (default: all)."
    required: false
    default: "all"
  node-version:
    description: "Node.js version used to run SkillOps CLI (requires >= 20)."
    required: false
    default: "22"

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Audit Catalog Security & Verify Multi-Runtime Transpilation
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_CATALOG_PATH: ${{ inputs.catalog-path }}
        INPUT_TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        if [[ -f "${ACTION_PATH}/dist/cli.js" ]]; then
          cli_cmd=(node "${ACTION_PATH}/dist/cli.js")
        else
          cli_cmd=(npx --yes skillops-cli@1.5.2)
        fi
        "${cli_cmd[@]}" audit --catalog "$INPUT_CATALOG_PATH" --strict
        "${cli_cmd[@]}" add --all --catalog "$INPUT_CATALOG_PATH" --targets "$INPUT_TARGETS" --dry-run
