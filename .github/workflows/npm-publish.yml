name: Publish to NPM (skillops-cli)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: Build, Verify & Publish skillops-cli to NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22 with NPM Registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify Release Tag Matches package.json Version
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          EXPECTED_TAG="v$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "::error::Release tag '${RELEASE_TAG}' does not match package.json version '${EXPECTED_TAG}'."
            exit 1
          fi
          echo "OK — Release tag '${RELEASE_TAG}' matches package.json ('${EXPECTED_TAG}')."

      - name: Lint, Typecheck, Test & Build
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Verify CLI Entrypoint
        run: |
          node ./dist/cli.js --version
          node ./dist/cli.js --help

      - name: Verify Catalog Layout & Security Before Publish
        shell: bash
        run: |
          set -euo pipefail
          node ./dist/cli.js audit --strict
          node -e "import('./dist/index.js').then((m)=>{for(const d of m.discoverSkillDirectories('./catalog')){m.parseSkillDirectory(d, { requireLayout: true });}for(const s of m.discoverSubagentFiles('./catalog')){m.parseSubagentFile(s);}const r=m.auditCatalogSecurity('./catalog');if(!r.passed){console.error(r.findings);process.exit(1);}})"

      - name: Publish skillops-cli to NPM with Provenance
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN_CHECK: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NPM_TOKEN_CHECK:-}" || -z "${NPM_TOKEN:-}" ]]; then
            echo "::error::Missing NPM_TOKEN secret; refusing to run npm publish against placeholder auth token."
            exit 1
          fi
          npm publish --provenance --access public
