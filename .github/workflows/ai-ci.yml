name: SkillOps AI Engine & Catalog CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  agent-and-skill-contract-gate:
    name: Audit Subagents & Hybrid Skill Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Subagents Frontmatter (catalog/subagents/**/SUBAGENT.md)
        run: |
          FOUND_SUBAGENTS=0
          while IFS= read -r -d '' agent_file; do
            FOUND_SUBAGENTS=1
            head -n 1 "$agent_file" | grep -q "^---$" || {
              echo "::error::Missing YAML frontmatter start in $agent_file"
              exit 1
            }
            grep -q "^name:" "$agent_file" || {
              echo "::error::Missing 'name:' field in $agent_file"
              exit 1
            }
            grep -q "^description:" "$agent_file" || {
              echo "::error::Missing 'description:' field in $agent_file"
              exit 1
            }
          done < <(find catalog/subagents -name "SUBAGENT.md" -print0)
          if [ "$FOUND_SUBAGENTS" -eq 0 ]; then
            echo "::error::No subagent definitions found in catalog/subagents/"
            exit 1
          fi
          echo "OK — All catalog/subagents/**/SUBAGENT.md definitions passed frontmatter audit."

      - name: Validate Catalog Skill Line Budgets (INV-SKILL-01 <= 250 lines)
        run: |
          if [ -d "catalog" ]; then
            while IFS= read -r -d '' skill_file; do
              LINE_COUNT=$(wc -l < "$skill_file")
              if [ "$LINE_COUNT" -gt 250 ]; then
                echo "::error file=$skill_file::SKILL.md exceeds Level 2 progressive disclosure budget ($LINE_COUNT > 250 lines)."
                exit 1
              fi
            done < <(find catalog -name "SKILL.md" -print0)
            echo "OK — All catalog SKILL.md files respect INV-SKILL-01 (<= 250 lines)."
          else
            echo "OK — Catalog directory not yet populated (pre-development readiness phase)."
          fi

      - name: Audit Catalog Scripts, Trojan-Source Unicode & Boundary Guards
        run: |
          python3 - <<'PY'
          import ast, hashlib, json, pathlib, re, sys

          FORBIDDEN_NETWORK_IMPORTS = {
              "urllib2", "urllib3", "httplib", "socket", "socketserver",
              "requests", "httpx", "aiohttp", "ftplib", "smtplib",
              "telnetlib", "paramiko", "websocket", "websockets",
              "ssl", "webbrowser",
          }
          FORBIDDEN_EXEC_IMPORTS = {
              "pickle", "cPickle", "marshal", "shelve", "ctypes", "cffi",
              "importlib", "builtins", "runpy", "code", "codeop", "zipimport",
          }
          FORBIDDEN_SHELL_IMPORTS = {
              "pty", "commands", "subprocess", "_posixsubprocess",
              "asyncio", "multiprocessing",
          }
          FORBIDDEN_SUBMODULES = {
              "urllib.request", "urllib.urlopen", "http.client", "xmlrpc.client",
          }
          FORBIDDEN_CALLS = {"eval", "exec", "__import__", "globals", "locals", "vars"}
          FORBIDDEN_OS_ATTRS = {
              "system", "popen", "spawnl", "spawnle", "spawnlp", "spawnlpe",
              "spawnv", "spawnve", "spawnvp", "spawnvpe", "posix_spawn", "posix_spawnp",
              "execl", "execle", "execlp", "execlpe", "execv", "execve", "execvp", "execvpe",
          }
          FORBIDDEN_BINARY_EXTS = {
              ".exe", ".dll", ".so", ".dylib", ".bin", ".wasm", ".pyc", ".pyo",
              ".pyd", ".msi", ".scr", ".com", ".jar", ".class", ".zip", ".tar",
              ".gz", ".tgz", ".7z", ".rar", ".bz2", ".xz",
          }
          SKIP_MEDIA_EXTS = {
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".bmp",
              ".pdf", ".woff", ".woff2", ".ttf", ".otf", ".eot",
          }
          MAX_FILE_BYTES = 2 * 1024 * 1024
          TROJAN_BIDI_RE = re.compile(r"[\u0000\u061C\u200E\u200F\u202A-\u202E\u2066-\u2069\uFEFF\U000E0000-\U000E007F]")

          allowlist_path = pathlib.Path(".skillops-security-allowlist.json")
          allowlist_entries = []
          if not allowlist_path.is_symlink() and allowlist_path.is_file():
              allowlist_data = json.loads(allowlist_path.read_text(encoding="utf-8"))
              if isinstance(allowlist_data, dict) and isinstance(allowlist_data.get("exceptions"), list):
                  allowlist_entries = allowlist_data["exceptions"]

          def is_allowlisted(rel_posix: str, rule_id: str, digest: str) -> bool:
              for entry in allowlist_entries:
                  if not isinstance(entry, dict):
                      continue
                  entry_rule = entry.get("rule") or entry.get("rule_id")
                  entry_rel = entry.get("relative_path")
                  entry_sha = entry.get("sha256")
                  if (
                      isinstance(entry_rel, str)
                      and isinstance(entry_rule, str)
                      and isinstance(entry_sha, str)
                      and entry_rel == rel_posix
                      and entry_rule == rule_id
                      and entry_sha.lower() == digest.lower()
                  ):
                      return True
              return False

          errors = []

          def record_finding(rel_posix: str, lineno: int, rule_id: str, digest: str, message: str) -> None:
              if not is_allowlisted(rel_posix, rule_id, digest):
                  errors.append(f"{rel_posix}:{lineno}: [{rule_id}] {message}")

          def classify_root_import(root_mod: str) -> str | None:
              if root_mod in FORBIDDEN_NETWORK_IMPORTS:
                  return "forbidden-network-import"
              if root_mod in FORBIDDEN_EXEC_IMPORTS:
                  return "forbidden-dynamic-exec"
              if root_mod in FORBIDDEN_SHELL_IMPORTS:
                  return "forbidden-shell-execution"
              return None

          catalog_root = pathlib.Path("catalog")

          for item in sorted(catalog_root.rglob("*")):
              if "__pycache__" in item.parts:
                  continue
              if item.is_symlink():
                  errors.append(f"{item.as_posix()}:1: [forbidden-symlink] forbidden symbolic link in catalog")
                  continue
              if item.is_file():
                  rel_posix = item.as_posix()
                  low = item.name.lower()
                  if low.endswith(".tar.gz") or item.suffix.lower() in FORBIDDEN_BINARY_EXTS:
                      errors.append(f"{rel_posix}:1: [forbidden-binary-file] forbidden binary or archive file '{item.name}'")
                      continue
                  if item.suffix.lower() in SKIP_MEDIA_EXTS:
                      continue
                  if item.lstat().st_size > MAX_FILE_BYTES:
                      errors.append(f"{rel_posix}:1: [oversized-file] catalog file exceeds 2 MiB limit")
                      continue
                  raw_bytes = item.read_bytes()
                  digest = hashlib.sha256(raw_bytes).hexdigest()
                  try:
                      txt = raw_bytes.decode("utf-8")
                  except UnicodeDecodeError:
                      continue
                  if txt.startswith("\ufeff"):
                      txt = txt[1:]
                  for idx, line in enumerate(txt.splitlines(), 1):
                      if len(line) > 4096:
                          record_finding(
                              rel_posix,
                              idx,
                              "suspicious-long-line",
                              digest,
                              f"suspicious long line ({len(line)} > 4096)",
                          )
                          continue
                      m = TROJAN_BIDI_RE.search(line)
                      if m:
                          cp = f"U+{ord(m.group(0)):04X}"
                          record_finding(
                              rel_posix,
                              idx,
                              "forbidden-trojan-unicode",
                              digest,
                              f"forbidden Trojan-Source / invisible control character {cp}",
                          )

          for py_file in sorted(catalog_root.rglob("*.py")):
              if "__pycache__" in py_file.parts or py_file.is_symlink():
                  continue
              rel_posix = py_file.as_posix()
              if py_file.lstat().st_size > MAX_FILE_BYTES:
                  continue
              raw_bytes = py_file.read_bytes()
              digest = hashlib.sha256(raw_bytes).hexdigest()
              try:
                  source = raw_bytes.decode("utf-8")
                  tree = ast.parse(source, filename=rel_posix)
              except (UnicodeDecodeError, SyntaxError) as exc:
                  errors.append(f"{rel_posix}:1: [python-parse-error] failed parsing Python script: {exc}")
                  continue
              for node in ast.walk(tree):
                  lineno = getattr(node, "lineno", 1)
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          root = alias.name.split(".")[0]
                          first_two = ".".join(alias.name.split(".")[:2])
                          root_rule = classify_root_import(root)
                          if root_rule:
                              record_finding(rel_posix, lineno, root_rule, digest, f"forbidden import '{root}'")
                          elif first_two in FORBIDDEN_SUBMODULES:
                              record_finding(rel_posix, lineno, "forbidden-network-import", digest, f"forbidden network client '{first_two}'")
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      root = node.module.split(".")[0]
                      first_two = ".".join(node.module.split(".")[:2])
                      imported = {a.name for a in node.names}
                      root_rule = classify_root_import(root)
                      if root_rule:
                          record_finding(rel_posix, lineno, root_rule, digest, f"forbidden from-import '{root}'")
                      elif first_two in FORBIDDEN_SUBMODULES:
                          record_finding(rel_posix, lineno, "forbidden-network-import", digest, f"forbidden network client '{first_two}'")
                      elif node.module == "urllib" and (imported & {"request", "urlopen"}):
                          record_finding(rel_posix, lineno, "forbidden-network-import", digest, "forbidden network client 'urllib.request'")
                      elif node.module in {"http", "xmlrpc"} and "client" in imported:
                          record_finding(rel_posix, lineno, "forbidden-network-import", digest, f"forbidden network client '{node.module}.client'")
                  elif isinstance(node, ast.Call):
                      if isinstance(node.func, ast.Name):
                          fn_name = node.func.id
                          if fn_name in FORBIDDEN_CALLS:
                              record_finding(rel_posix, lineno, "forbidden-dynamic-exec", digest, f"forbidden dynamic call '{fn_name}()'")
                          elif fn_name == "compile" and (len(node.args) >= 3 or any(kw.arg == "mode" for kw in node.keywords)):
                              record_finding(rel_posix, lineno, "forbidden-dynamic-exec", digest, "forbidden dynamic compilation 'compile()'")
                          elif fn_name == "getattr":
                              record_finding(rel_posix, lineno, "forbidden-dynamic-exec", digest, "forbidden reflection call 'getattr()'")
                      elif isinstance(node.func, ast.Attribute) and isinstance(node.func.value, ast.Name) and node.func.value.id == "os" and node.func.attr in FORBIDDEN_OS_ATTRS:
                          record_finding(rel_posix, lineno, "forbidden-shell-execution", digest, f"forbidden shell call 'os.{node.func.attr}()'")
                      for kw in node.keywords:
                          if kw.arg == "shell" and isinstance(kw.value, ast.Constant) and kw.value.value is True:
                              record_finding(rel_posix, lineno, "forbidden-shell-execution", digest, "forbidden 'shell=True' in subprocess call")

          if errors:
              for err in errors:
                  print(f"::error::{err}")
              sys.exit(1)
          print("OK — All catalog files and Python scripts passed AST, Trojan-Source, and boundary security audit.")
          PY

  npx-engine-qa:
    name: Node.js ${{ matrix.node-version }} (${{ matrix.os }}) NPX Engine & TypeScript QA Gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ["20", "22"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Dependencies & Audit Supply Chain
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Run TypeScript Lint, Typecheck, Vitest, Build & Strict Catalog Audit
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm test
          npm run build
          node ./dist/cli.js --version
          node ./dist/cli.js --help
          node ./dist/cli.js audit --strict
